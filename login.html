<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VitalLog: Track your health habits, connect with friends, and stay updated on the latest research." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <title>VitalLog — Login</title>
</head>

<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <img src="logo.png" alt="VitalLog logo" />
        <div>
          <h1>VitalLog</h1>
          <p class="session-status">Logged in as: <span id="current-user">Guest</span></p>
        </div>
      </div>
      <nav id="primary-nav">
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Login / Register</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="friends.html">Friends</a></li>
          <li><a href="articles.html">Research Feed</a></li>
        </menu>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Welcome back</h2>
       <p>Your session status is shown in the header above.</p>
    </section>

    <section>
      <h3>Login</h3>
      <form action="#" method="post">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" name="username" placeholder="your username" required />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" placeholder="your password" required />

        <button type="submit">Login</button>
      </form>
    </section>

    <section>
      <h3>Create an Account</h3>
      <form action="#" method="post">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" name="username" placeholder="choose a username" required />

        <label for="register-email">Email</label>
        <input type="email" id="register-email" name="email" placeholder="you@example.com" required />

        <label for="register-password">Password</label>
        <input type="password" id="register-password" name="password" placeholder="choose a password" required />

        <button type="submit">Create Account</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Brit Richardson — CS 260 Startup Project</p>
    <p>
      <a href="https://github.com/BrittonER01/startup" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
    </p>
  </footer>
</body>
</html>
